[package]
name = "ecs-rust"
version = "0.1.0"
edition = "2021"
description = "Rust port of a PSR-12 subset of ecs-go, for a Go-vs-Rust performance comparison"

[[bin]]
name = "ecs-rust"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

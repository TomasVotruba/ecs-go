name: CI

on:
    push:
        branches:
            - main
    pull_request: null

jobs:
    build_and_test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version: 'stable'

            - run: go build ./...

            - run: go vet ./...

            - run: go test ./...
